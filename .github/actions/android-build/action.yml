name: Build and check Android
description: Shared JDK, SDK, Gradle build and device-independent regressions
inputs:
  version:
    description: Android MAJOR.MINOR.PATCH version
    default: '0.1.1'
runs:
  using: composite
  steps:
    - uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
      with:
        distribution: temurin
        java-version: '17'
    - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
      with:
        cache-read-only: ${{ github.ref != 'refs/heads/main' }}
    - name: Install Android SDK packages
      shell: bash
      run: |
        "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
          'platforms;android-35' 'build-tools;34.0.0' 'build-tools;35.0.0' 'platform-tools'
    - name: Build APKs, unit tests and lint
      shell: bash
      env:
        RELEASE_VERSION: ${{ inputs.version }}
      run: >-
        ./gradlew --no-daemon --console=plain
        -PreleaseVersion="$RELEASE_VERSION"
        :app:assembleDebug :app:assembleRelease :app:testDebugUnitTest :app:lintDebug
    - name: Hardware and UI regressions
      shell: bash
      run: |
        python3 -m unittest discover -s tools/release-tests -v
        python3 tools/fan-policy/test.py
        python3 tools/cooling-ui-regression.py
        python3 tools/home-back-regression.py
        python3 tools/fan-state-completion-regression.py
        python3 tools/architecture-regression.py
        python3 tools/hardware-bridge/build.py --sdk "$ANDROID_HOME" --java-home "$JAVA_HOME"
